<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>KeyRotator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231f5f52' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 8h12l-3-3M20 16H8l3 3'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --sunken: #f0efea;
  --line: #e4e2dc;
  --line-strong: #cfccc2;
  --ink: #1c1b19;
  --ink-2: #56534c;
  --ink-3: #8b877d;
  --accent: #1f5f52;
  --accent-ink: #ffffff;
  --accent-soft: #e2eeea;
  --ok: #2b7a53;
  --ok-soft: #e3f1e9;
  --warn: #92600f;
  --warn-soft: #f6eddb;
  --bad: #a13a2b;
  --bad-soft: #f7e5e1;
  --off: #76726a;
  --off-soft: #ebeae5;
  --radius: 10px;
  --radius-sm: 6px;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151513;
    --surface: #1c1b19;
    --sunken: #181715;
    --line: #2c2a26;
    --line-strong: #3d3a33;
    --ink: #ecebe6;
    --ink-2: #aeaaa0;
    --ink-3: #7f7b71;
    --accent: #7cc7b3;
    --accent-ink: #0f1f1b;
    --accent-soft: #1d2f2a;
    --ok: #7cc7a0;
    --ok-soft: #1b2a22;
    --warn: #e0b25c;
    --warn-soft: #2e2615;
    --bad: #ec8a7d;
    --bad-soft: #321d1a;
    --off: #9d998e;
    --off-soft: #262521;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.faint { color: var(--ink-3); }
.small { font-size: 12.5px; }
.muted { color: var(--ink-2); }
code { font-family: var(--mono); font-size: 12px; background: var(--sunken); padding: 1px 5px; border-radius: 4px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 2px;
  padding: 20px 14px;
  border-right: 1px solid var(--line);
  background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; font-weight: 650; letter-spacing: -0.01em; }
.brand svg { color: var(--accent); flex: none; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  color: var(--ink-2); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: var(--sunken); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--sunken); color: var(--ink); font-weight: 600; }
.nav .count { margin-left: auto; font: 12px var(--mono); color: var(--ink-3); }
.side-foot { margin-top: auto; padding: 10px 8px 0; font-size: 12px; color: var(--ink-3); }
.side-foot .mono { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.main { padding: 28px 40px 64px; min-width: 0; max-width: 1200px; width: 100%; }
.page-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.015em; }
.page-head .sub-title { color: var(--ink-2); font-size: 13px; margin-top: 1px; }
.page-head .grow { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.dot.off { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }

/* ---------- controls ---------- */
button, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 14px;
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink);
  font: inherit; font-weight: 550; cursor: pointer; white-space: nowrap;
}
button:hover { background: var(--sunken); }
button:disabled { opacity: 0.55; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover { filter: brightness(1.06); background: var(--accent); }
button.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
button.ghost:hover { background: var(--sunken); color: var(--ink); }
button.danger { color: var(--bad); }
button.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
button.icon { width: 28px; height: 28px; padding: 0; font-size: 16px; line-height: 1; border-color: transparent; background: transparent; color: var(--ink-3); }
button.icon:hover { color: var(--bad); background: var(--bad-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }

input, select {
  width: 100%; min-width: 0; height: 34px; padding: 0 10px;
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink); font: inherit;
}
input::placeholder { color: var(--ink-3); }
input:disabled { background: var(--sunken); color: var(--ink-3); }
input.mono { font-family: var(--mono); font-size: 12.5px; }
label.lbl { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 550; color: var(--ink-2); }
.field-note { margin-top: 6px; font-size: 12px; color: var(--ink-3); }

.switch { position: relative; display: inline-block; width: 36px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span {
  position: absolute; inset: 0; border-radius: 999px;
  background: var(--line-strong); transition: background .15s;
}
.switch span::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%; background: var(--surface);
  transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
}
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch input:disabled + span { opacity: .5; }

/* ---------- surfaces ---------- */
.surface { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.section-title { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
.section-title h2 { margin: 0; font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }

.summary {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  margin-bottom: 28px; overflow: hidden;
}
.summary > div { padding: 14px 18px; border-left: 1px solid var(--line); }
.summary > div:first-child { border-left: 0; }
.summary .v { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.summary .k { font-size: 12.5px; color: var(--ink-2); }
.summary .ok { color: var(--ok); }
.summary .warn { color: var(--warn); }
.summary .bad { color: var(--bad); }

/* ---------- badges & tags ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 550; white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-cd { background: var(--warn-soft); color: var(--warn); }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-off { background: var(--off-soft); color: var(--off); }
.tag {
  padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--sunken); color: var(--ink-2); font-size: 12px; white-space: nowrap;
}

/* ---------- providers ---------- */
.provider { margin-bottom: 16px; overflow: hidden; }
.p-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.p-name { font-size: 15px; font-weight: 650; }
.p-actions { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.p-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.fields { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.rule-chip {
  display: inline-flex; gap: 6px; align-items: center;
  padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunken);
  font: 12px var(--mono); color: var(--ink-2);
}
.rc-in, .rc-eq { color: var(--ink-3); }
.rc-name { color: var(--ink); }
.k { color: var(--accent); }
.proxy { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.proxy code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; background: none; padding: 0; color: var(--ink-2); }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  padding: 9px 18px; border-bottom: 1px solid var(--line);
  text-align: left; font-size: 12px; font-weight: 550; color: var(--ink-3); white-space: nowrap;
}
td { padding: 10px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.right { text-align: right; white-space: nowrap; }
.right button { height: 28px; padding: 0 8px; font-size: 12.5px; }
.kval { color: var(--ink-2); }

.keybar { display: flex; gap: 8px; padding: 12px 18px; background: var(--sunken); border-top: 1px solid var(--line); }
.keybar input { flex: 1; }
.keybar input.alias { flex: 0 0 190px; }
.panel { padding: 18px; background: var(--sunken); border-bottom: 1px solid var(--line); }
.panel .row + .row { margin-top: 14px; }
.grid2, .grid3 { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sep { height: 1px; background: var(--line); margin: 18px 0; }
.hint { margin-top: 10px; font-size: 12.5px; color: var(--ink-3); }
.section-head2 { font-size: 13px; font-weight: 650; margin: 0 0 2px; }
.rule {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; margin-bottom: 8px;
  border: 1px solid var(--line); border-left: 3px solid transparent;
  border-radius: var(--radius-sm); background: var(--sunken);
}
.rule input[type=checkbox] { width: 16px; height: 16px; flex: none; accent-color: var(--accent); }
.rule-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.rule-main > select, .rule-main > input { max-width: 100%; }
.rule .custom { display: grid; grid-template-columns: 96px 1fr 1fr; gap: 8px; }
.rule .custom[hidden] { display: none; }
.rule [data-rf="preset"] { max-width: 360px; }
.rule-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.rule .group-in { width: 130px; height: 30px; }
.held-note { font-size: 11px; color: var(--warn); }
/* Group rails: rows sharing a group share a colour on their left edge. */
.rule.grouped[data-slot="0"] { border-left-color: #3b6fb6; }
.rule.grouped[data-slot="1"] { border-left-color: #8a5cc2; }
.rule.grouped[data-slot="2"] { border-left-color: #b7791f; }
.rule.grouped[data-slot="3"] { border-left-color: #2b8a7a; }
.rule.grouped[data-slot="4"] { border-left-color: #b5507a; }
.rule.held { border-style: dashed; border-left-style: solid; opacity: .72; }
.rc-group { color: var(--accent); font-weight: 600; }
.rule-chip.held { opacity: .55; border-style: dashed; }
@media (max-width: 760px) { .rule .custom { grid-template-columns: 1fr; } }



.empty { padding: 36px 24px; text-align: center; color: var(--ink-3); }
.empty .big { margin-bottom: 4px; font-size: 15px; font-weight: 600; color: var(--ink); }
.empty.compact { padding: 20px; }

.log-count { margin-left: auto; }
.badge-code { font: 12px var(--mono); }

/* ---------- settings ---------- */
.settings-group { padding: 4px 0; }
.settings-group + .settings-group { border-top: 1px solid var(--line); }
.setting { display: grid; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr); gap: 24px; padding: 18px 20px; align-items: start; }
.setting h3 { margin: 0 0 3px; font-size: 14px; font-weight: 600; }
.setting p { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.setting .control { min-width: 0; }
.toggle-row { display: flex; align-items: center; gap: 12px; }
.inline { display: flex; gap: 8px; align-items: center; }
.savebar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }

/* ---------- activity ---------- */
.log-wrap { overflow-x: auto; }
.log-wrap td { font-size: 12.5px; }

/* ---------- toast ---------- */
.toast {
  position: fixed; right: 20px; bottom: 20px; z-index: 10;
  max-width: 380px; padding: 11px 14px; border-radius: var(--radius-sm);
  background: var(--ink); color: var(--bg); font-size: 13px;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
  opacity: 0; transform: translateY(6px); pointer-events: none;
  transition: opacity .18s, transform .18s;
}
.toast.show { opacity: 1; transform: none; }
.toast.ok { background: var(--ok); color: #fff; }
.toast.err { background: var(--bad); color: #fff; }

.foot { margin-top: 36px; font-size: 12px; color: var(--ink-3); }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .summary > div:nth-child(4) { border-left: 0; }
  .summary > div:nth-child(n+4) { border-top: 1px solid var(--line); }
  .setting { grid-template-columns: 1fr; gap: 10px; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 0 8px 0 0; }
  .nav { display: flex; gap: 2px; }
  .side-foot { display: none; }
  .main { padding: 20px 16px 48px; }
  .grid3, .grid2 { grid-template-columns: 1fr; }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary > div { border-left: 0; border-top: 1px solid var(--line); }
  .summary > div:nth-child(odd) { border-right: 1px solid var(--line); }
  .summary > div:nth-child(-n+2) { border-top: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h12l-3-3M20 16H8l3 3"/></svg>
      KeyRotator
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#providers" data-nav="providers">Providers <span class="count" id="nav-providers"></span></a>
      <a href="#activity" data-nav="activity">Activity <span class="count" id="nav-activity"></span></a>
      <a href="#settings" data-nav="settings">Settings</a>
    </nav>
    <div class="side-foot">
      <span id="side-version">—</span>
      <span class="mono" id="side-addr">—</span>
    </div>
  </aside>

  <main class="main">
    <header class="page-head">
      <div>
        <h1 id="page-title">Providers</h1>
        <div class="sub-title" id="page-sub"></div>
      </div>
      <div class="grow"></div>
      <span class="live" id="live"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
      <button id="btn-new" class="primary" data-only="providers">+ Provider</button>
    </header>

    <section data-page="providers">
      <div class="surface summary" id="stats"></div>
      <div id="newprovider"></div>
      <div id="main"></div>
    </section>

    <section data-page="activity" hidden>
      <div class="surface">
        <div class="log-wrap" id="logs"><div class="empty">No requests yet.</div></div>
      </div>
    </section>

    <section data-page="settings" hidden>
      <div class="surface" id="settings-form"></div>
    </section>

    <footer class="foot" id="footer"></footer>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<datalist id="group-names"></datalist>

<script>
const $ = (s, r=document) => r.querySelector(s);
let S = { providers: [], proxyBase: '', addr: '', listen: '', version: '', configPath: '', os: '',
          maxRetries: 3, cooldownSec: 60, adminTokenSet: false,
          proxyToken: '', rateLimitRPS: 0, keyRateLimitRPS: 0,
          autostart: { supported: false, enabled: false, mechanism: '' } };
let LOGS = [];
const reveal = {};
const keyEdit = {};
const providerEdit = {};
const keyDraft = {};
const keyAliasDraft = {};
let newOpen = false;
let logSig = '';
let page = 'providers';
let firstLoadDone = false;

const PAGES = {
  providers: { title: 'Providers', sub: 'Pooled upstream keys, injected into every request' },
  activity:  { title: 'Activity',  sub: 'Most recent proxied requests, newest first' },
  settings:  { title: 'Settings',  sub: 'Behaviour, security and start-up' },
};

const token = () => localStorage.getItem('kr_token') || '';

async function api(path, method='GET', body){
  const headers = { 'Content-Type':'application/json' };
  if (token()) headers['X-Admin-Token'] = token();
  let res;
  try {
    res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch(e){ throw new Error('cannot reach server'); }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = { error: text }; }
  if (!res.ok) throw new Error((data && data.error) || res.statusText);
  return data;
}

let toastTimer = null;
function toast(msg, kind){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind === true || kind === 'err' ? ' err' : kind === 'ok' ? ' ok' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', 3200);
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const rpsText = v => String(Math.round(v * 1000) / 1000);
function rel(ts){
  if (!ts) return '—';
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 5) return 'just now';
  if (d < 60) return d + 's ago';
  if (d < 3600) return Math.floor(d/60) + 'm ago';
  if (d < 86400) return Math.floor(d/3600) + 'h ago';
  return Math.floor(d/86400) + 'd ago';
}
function statusBadge(k){
  if (!k.enabled) return '<span class="badge b-off">disabled</span>';
  const now = Math.floor(Date.now()/1000);
  if (k.status === 'cooldown'){
    const left = k.cooldownUntil - now;
    return '<span class="badge b-cd">cooling ' + (left > 0 ? left + 's' : '…') + '</span>';
  }
  switch (k.status){
    case 'invalid': return '<span class="badge b-bad">invalid</span>';
    case 'error':   return '<span class="badge b-bad">error</span>';
    case 'ok':      return '<span class="badge b-ok">ok</span>';
    default:        return '<span class="badge b-off">' + esc(k.status || 'unknown') + '</span>';
  }
}
const focusedIn = (sel) => {
  const el = document.activeElement;
  const root = document.querySelector(sel);
  return !!(el && root && root.contains(el) && ['INPUT','TEXTAREA','SELECT'].includes(el.tagName));
};

// ---------- routing ----------

function showPage(name, { fromHash = false } = {}){
  if (!PAGES[name]) name = 'providers';
  page = name;
  document.querySelectorAll('[data-page]').forEach(s => s.hidden = s.dataset.page !== name);
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  $('#page-title').textContent = PAGES[name].title;
  $('#page-sub').textContent = PAGES[name].sub;
  document.querySelectorAll('[data-only]').forEach(b => b.hidden = b.dataset.only !== name);
  if (!fromHash && location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  if (name === 'settings') renderSettings();
}
window.addEventListener('hashchange', () => showPage(location.hash.slice(1), { fromHash: true }));

// ---------- data loading (never rewrites a form you are typing in) ----------

async function load(){
  try {
    const [st, lg] = await Promise.all([ api('/api/state'), api('/api/logs') ]);
    S = st; LOGS = lg.logs || [];
    $('#status').textContent = 'online';
    $('#dot').className = 'dot';
    $('#side-version').textContent = 'v' + S.version;
    $('#side-addr').textContent = S.addr;
    $('#footer').innerHTML = 'Config <span class="mono">' + esc(S.configPath) + '</span>' +
      ' &nbsp;·&nbsp; proxy base <span class="mono">' + esc(S.proxyBase) + '&lt;provider&gt;/…</span>' +
      ' &nbsp;·&nbsp; manage from a terminal with <span class="mono">keyrotator help</span>';
    renderStats();
    updateProviders();
    updateLogs();
    // Settings are drawn from the state, so draw them once the first load has
    // landed. After that they only re-render on navigation or save, never on
    // the poll, so typing in a form is never interrupted.
    if (!firstLoadDone){
      firstLoadDone = true;
      if (page === 'settings') renderSettings();
    }
  } catch(e){
    $('#status').textContent = 'offline';
    $('#dot').className = 'dot off';
    toast(e.message === "cannot reach server" ? "KeyRotator is not running. Start it with: keyrotator start" : "Load failed: " + e.message, true);
  }
}

function renderStats(){
  let keys = 0, ok = 0, bad = 0, cool = 0;
  for (const p of S.providers) for (const k of p.keys || []){
    keys++;
    if (!k.enabled) continue;
    if (k.status === 'ok') ok++;
    else if (k.status === 'cooldown') cool++;
    else if (k.status === 'invalid' || k.status === 'error') bad++;
  }
  $('#nav-providers').textContent = S.providers.length || '';
  $('#nav-activity').textContent = LOGS.length || '';
  const cell = (cls, v, label) => '<div><div class="v ' + cls + '">' + v + '</div><div class="k">' + label + '</div></div>';
  $('#stats').innerHTML =
    cell('', S.providers.length, 'providers') +
    cell('', keys, 'keys') +
    cell('ok', ok, 'healthy') +
    cell('warn', cool, 'cooling') +
    cell('bad', bad, 'need attention');
}

// ---------- provider form (fields + injection rules) ----------

// ---------- request fields ----------
// "Where your API key is sent" has one row per place the key goes. The detail
// fields appear only for "Custom" (progressive disclosure). "Fixed values" are
// sent unchanged. Any row can join a group by typing the same group name:
// grouped rows are sent together, all or nothing.

const KEY_PRESETS = [
  { id: 'bearer',    label: 'Authorization header (Bearer)', in: 'header', name: 'Authorization',  prefix: 'Bearer ' },
  { id: 'x-api-key', label: 'x-api-key header',              in: 'header', name: 'x-api-key',      prefix: '' },
  { id: 'goog',      label: 'x-goog-api-key header',         in: 'header', name: 'x-goog-api-key', prefix: '' },
  { id: 'q-api_key', label: 'api_key in the URL',            in: 'query',  name: 'api_key',        prefix: '' },
  { id: 'custom',    label: 'Custom…' },
];

// Colours for group rails. Each group takes the next one, wrapping around.
const GROUP_SLOTS = 5;

// presetFor finds which preset a rule matches, so the dropdown shows the truth.
function presetFor(r){
  const hit = KEY_PRESETS.find(p => p.in && p.in === r.in && p.name === r.name && (p.prefix || '') === (r.prefix || ''));
  return hit ? hit.id : 'custom';
}

// groupOf is the comparable form of a group name: "Beta" and " beta " match.
function groupOf(r){ return String(r.group || '').trim().toLowerCase(); }

// heldGroups returns the groups that are held back: one of their members is off
// or has no name. This mirrors activeRules in rotator.go, the source of truth.
function heldGroups(rules){
  const held = new Set();
  for (const r of rules){
    const g = groupOf(r);
    if (g && !(r.enabled && String(r.name || '').trim())) held.add(g);
  }
  return held;
}

function groupInput(r){
  return '<span class="rule-side">' +
    '<input data-rf="group" class="group-in mono" list="group-names" placeholder="no group" value="' + esc(r.group || '') + '"' +
    ' aria-label="Group, optional" spellcheck="false">' +
    '<span class="held-note" hidden>held</span>' +
  '</span>';
}

function keyRuleHTML(r){
  r = Object.assign({ enabled:true, in:'header', name:'', prefix:'', suffix:'', group:'' }, r || {});
  const preset = presetFor(r);
  const options = KEY_PRESETS.map(p =>
    '<option value="' + p.id + '"' + (preset === p.id ? ' selected' : '') + '>' + esc(p.label) + '</option>').join('');
  const locs = ['header','query'].map(m =>
    '<option' + (r.in === m ? ' selected' : '') + '>' + m + '</option>').join('');
  return '<div class="rule" data-kind="key" data-suffix="' + esc(r.suffix) + '">' +
    '<input type="checkbox" data-rf="enabled" aria-label="On"' + (r.enabled !== false ? ' checked' : '') + '>' +
    '<div class="rule-main">' +
      '<select data-rf="preset" aria-label="Send the key as">' + options + '</select>' +
      '<div class="custom"' + (preset === 'custom' ? '' : ' hidden') + '>' +
        '<select data-rf="in" aria-label="Location">' + locs + '</select>' +
        '<input data-rf="name" class="mono" placeholder="field name" value="' + esc(r.name) + '" aria-label="Field name" spellcheck="false">' +
        '<input data-rf="prefix" class="mono" placeholder="prefix, e.g. Bearer " value="' + esc(r.prefix) + '" aria-label="Prefix" spellcheck="false">' +
      '</div>' +
    '</div>' +
    groupInput(r) +
    '<button type="button" class="icon" data-act="del-rule" title="Remove" aria-label="Remove">×</button>' +
  '</div>';
}

function fixedRuleHTML(r){
  r = Object.assign({ enabled:true, in:'header', name:'', value:'', prefix:'', suffix:'', group:'' }, r || {});
  return '<div class="rule" data-kind="fixed" data-in="' + esc(r.in) + '" data-prefix="' + esc(r.prefix) + '" data-suffix="' + esc(r.suffix) + '">' +
    '<input type="checkbox" data-rf="enabled" aria-label="On"' + (r.enabled !== false ? ' checked' : '') + '>' +
    '<div class="rule-main">' +
      '<input data-rf="name" class="mono" placeholder="header name, e.g. x-api-version" value="' + esc(r.name) + '" aria-label="Header name" spellcheck="false">' +
      '<input data-rf="value" class="mono" placeholder="value, e.g. 2024-02-01" value="' + esc(r.value) + '" aria-label="Value" spellcheck="false">' +
    '</div>' +
    groupInput(r) +
    '<button type="button" class="icon" data-act="del-rule" title="Remove" aria-label="Remove">×</button>' +
  '</div>';
}

// ruleName is the field name a row would send, whichever kind of row it is.
function ruleName(row){
  const el = row.dataset.kind === 'key'
    ? row.querySelector('.custom [data-rf="name"]')
    : row.querySelector('[data-rf="name"]');
  return el ? el.value.trim() : '';
}

// applyPreset copies a chosen preset into the detail fields of its row.
function applyPreset(row){
  const sel = row.querySelector('[data-rf="preset"]');
  const custom = row.querySelector('.custom');
  const p = KEY_PRESETS.find(x => x.id === sel.value);
  if (!p || !p.in){ custom.hidden = false; return; }
  custom.hidden = true;
  row.querySelector('.custom [data-rf="in"]').value = p.in;
  row.querySelector('.custom [data-rf="name"]').value = p.name;
  row.querySelector('.custom [data-rf="prefix"]').value = p.prefix || '';
}

// refreshGroups redraws the group rails and "held" notes inside one form. It
// runs on every edit, so the picture always matches what will be saved.
function refreshGroups(scope){
  if (!scope) return;
  const rows = [...scope.querySelectorAll('.rule')];
  const info = rows.map(row => {
    const label = row.querySelector('[data-rf="group"]').value.trim();
    return {
      row, label, key: label.toLowerCase(),
      ok: row.querySelector('[data-rf="enabled"]').checked && ruleName(row) !== '',
    };
  });
  const held = new Set(info.filter(x => x.key && !x.ok).map(x => x.key));
  const slot = {}; let next = 0;
  for (const x of info){
    const r = x.row;
    r.classList.toggle('grouped', !!x.key);
    if (x.key){
      if (!(x.key in slot)) slot[x.key] = (next++) % GROUP_SLOTS;
      r.dataset.slot = slot[x.key];
    } else {
      delete r.dataset.slot;
    }
    const isHeld = !!x.key && held.has(x.key);
    r.classList.toggle('held', isHeld);
    const note = r.querySelector('.held-note');
    note.hidden = !isHeld;
    note.title = isHeld ? 'Held: every field in group "' + x.label + '" must be on and named' : '';
  }
  // Offer the group names already in use, so a typed name matches exactly.
  const names = [...new Set(info.filter(x => x.label).map(x => x.label))];
  document.getElementById('group-names').innerHTML = names.map(n => '<option value="' + esc(n) + '">').join('');
}

    '<div class="sep"></div>' +

    'if one of them is off or has no name, none of the group is sent.</p>';
}

// readForm turns the open form into a provider body. A grouped row with no name
// sets groupError, because saving it would silently hold its whole group.
function readForm(root){
  const out = {};
  root.querySelectorAll('[data-f]').forEach(el => { out[el.dataset.f] = el.value.trim(); });
  // Blank rate limits mean "inherit the global value", so drop them entirely.
  ['rateLimitRPS', 'keyRateLimitRPS'].forEach(f => {
    if (!(f in out)) return;
    if (out[f] === '') delete out[f];
    else out[f] = Number(out[f]);
  });
  const rules = [];
  const badGroups = [];
  root.querySelectorAll('[data-keyrules] .rule, [data-fixedrules] .rule').forEach(row => {
    const group = row.querySelector('[data-rf="group"]').value.trim();
    const name = ruleName(row);
    if (!name){
      if (group) badGroups.push(group);
      return;
    }
    const enabled = row.querySelector('[data-rf="enabled"]').checked;
    if (row.dataset.kind === 'key'){
      rules.push({
        enabled, in: row.querySelector('.custom [data-rf="in"]').value, name,
        source: 'key', value: '',
        prefix: row.querySelector('.custom [data-rf="prefix"]').value,
        suffix: row.dataset.suffix || '', group,
      });
    } else {
      rules.push({
        enabled, in: row.dataset.in || 'header', name,
        source: 'static', value: row.querySelector('[data-rf="value"]').value.trim(),
        prefix: row.dataset.prefix || '', suffix: row.dataset.suffix || '', group,
      });
    }
  });
  if (badGroups.length){
    out.groupError = 'Give the field in group "' + badGroups[0] + '" a name, or clear its group.';
  }
  out.inject = rules;
  return out;
}

// formBody reads a provider form for saving, or shows why it cannot be saved.
function formBody(root){
  const body = readForm(root);
  if (body.groupError){ toast(body.groupError, true); return null; }
  delete body.groupError;
  return body;
}

// Patch live values in place so polling never disturbs focus or selection.
function updateProviders(){
  const cards = document.querySelectorAll('#main [data-card]');
  if (cards.length !== S.providers.length){ softRenderMain(); return; }
  for (const p of S.providers){
    const card = document.querySelector('#main [data-card="' + p.id + '"]');
    if (!card){ softRenderMain(); return; }
    if (card.querySelectorAll('tbody tr[data-kid]').length !== (p.keys || []).length){ softRenderMain(); return; }
    patchCard(card, p);
  }
}
function softRenderMain(){
  if (focusedIn('#main')) return;   // don't yank a form out from under the user
  renderMain();
}
function setText(root, sel, txt){ const el = root.querySelector(sel); if (el) el.textContent = txt; }
function patchCard(card, p){
  // The field chips show held groups, so they are redrawn with the live state.
  const fields = card.querySelector('.fields');
  if (fields) fields.innerHTML = ruleChips(p);
  const badge = card.querySelector('[data-p="badge"]');
  if (badge){ badge.className = 'badge ' + (p.enabled ? 'b-ok' : 'b-off'); badge.textContent = p.enabled ? 'enabled' : 'disabled'; }
  const tg = card.querySelector('[data-act="toggle-provider"]');
  if (tg) tg.textContent = p.enabled ? 'Disable' : 'Enable';
  for (const k of p.keys || []){
    const row = card.querySelector('tr[data-kid="' + k.id + '"]');
    if (!row) continue;
    const st = row.querySelector('[data-k="status"]');
    if (st) st.innerHTML = statusBadge(k);
    setText(row, '[data-k="ok"]', String(k.success || 0));
    setText(row, '[data-k="err"]', String(k.errors || 0));
    setText(row, '[data-k="used"]', rel(k.lastUsed));
  }
}

function ruleChips(p){
  const all = p.inject || [];
  const on = all.filter(r => r.enabled);
  if (!on.length) return '<span class="faint small">No fields enabled — the key is not injected anywhere.</span>';
  const held = heldGroups(all);
  return on.map(r => {
    const val = (r.source === 'static')
      ? (r.value ? esc(r.value) : '<span class="faint">empty</span>')
      : '<span class="k">‹key›</span>';
    const g = groupOf(r);
    const isHeld = !!g && held.has(g);
    const title = r.in + ' ' + r.name + (g ? ' · group ' + r.group : '') +
      (isHeld ? ' · held: a field in its group is off' : '');
    return '<span class="rule-chip' + (isHeld ? ' held' : '') + '" title="' + esc(title) + '">' +
      (g ? '<span class="rc-group">' + esc(r.group) + '</span>' : '') +
      '<span class="rc-in">' + esc(r.in) + '</span>' +
      '<span class="rc-name">' + esc(r.name) + '</span>' +
      '<span class="rc-eq">→</span>' +
      '<span class="rc-val">' + esc(r.prefix) + val + esc(r.suffix) + '</span></span>';
  }).join('');
}

function providerCard(p){
  const editing = !!providerEdit[p.id];
  const token = p.proxyToken || S.proxyToken || '';
  const proxy = S.proxyBase + p.id + '/' + (token ? token + '/' : '');
  const provRPS = (p.rateLimitRPS === null || p.rateLimitRPS === undefined) ? S.rateLimitRPS : p.rateLimitRPS;
  const keyRPS = (p.keyRateLimitRPS === null || p.keyRateLimitRPS === undefined) ? S.keyRateLimitRPS : p.keyRateLimitRPS;
  const keys = p.keys || [];
  const rows = keys.map(k => keyRow(p, k)).join('');
  const table = keys.length
    ? '<div class="tbl-wrap"><table><thead><tr><th>Alias</th><th>Key</th><th>Status</th><th class="num">OK</th><th class="num">Errors</th><th>Last used</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>'
    : '<div class="empty compact">No keys yet — paste one below to start rotating.</div>';

  const editBlock = editing
    ? '<div class="panel">' + providerForm(p) +
      '<div class="sep"></div>' +
      '<div class="inline"><button class="primary sm" data-act="save-provider" data-id="' + p.id + '">Save changes</button>' +
      '<button class="ghost sm" data-act="cancel-provider" data-id="' + p.id + '">Cancel</button></div></div>'
    : '';

  const draft = keyDraft[p.id] || '';
  const addKey = '<div class="keybar">' +
      '<input data-act="key-value" data-id="' + p.id + '" placeholder="Paste an API key" value="' + esc(draft) + '" spellcheck="false" autocomplete="off" class="mono" aria-label="New API key">' +
      '<input data-act="key-alias" data-id="' + p.id + '" class="alias" placeholder="Alias (optional)" value="' + esc(keyAliasDraft[p.id] || '') + '" spellcheck="false" autocomplete="off" aria-label="Alias for the new key">' +
      '<button class="primary sm" data-act="add-key" data-id="' + p.id + '">Add key</button>' +
      '<button class="ghost sm" data-act="test-provider" data-id="' + p.id + '">Test all</button></div>';

  return '<article class="surface provider" data-card="' + p.id + '">' +
    '<div class="p-head">' +
      '<span class="p-name">' + esc(p.name) + '</span>' +
      '<span class="badge ' + (p.enabled ? 'b-ok' : 'b-off') + '" data-p="badge">' + (p.enabled ? 'enabled' : 'disabled') + '</span>' +
      '<span class="p-actions">' +
        '<button class="ghost sm" data-act="toggle-provider" data-id="' + p.id + '">' + (p.enabled ? 'Disable' : 'Enable') + '</button>' +
        '<button class="ghost sm" data-act="edit-provider" data-id="' + p.id + '">' + (editing ? 'Close' : 'Edit') + '</button>' +
        '<button class="ghost sm danger" data-act="del-provider" data-id="' + p.id + '" data-name="' + esc(p.name) + '">Delete</button>' +
      '</span>' +
    '</div>' +
    '<div class="p-meta">' +
      '<span class="mono small muted">' + esc(p.baseUrl) + '</span>' +
      '<span class="tag">' + esc(p.strategy) + '</span>' +
      '<span class="tag">health ' + esc(p.healthPath) + '</span>' +
      (token ? '<span class="tag" title="Requests must carry the proxy token">secured</span>' : '') +
      (provRPS > 0 ? '<span class="tag" title="Provider-wide rate limit">' + rpsText(provRPS) + ' req/s</span>' : '') +
      (keyRPS > 0 ? '<span class="tag" title="Per-key rate limit">' + rpsText(keyRPS) + ' req/s per key</span>' : '') +
    '</div>' +
    '<div class="fields">' + ruleChips(p) + '</div>' +
    '<div class="proxy"><code>' + esc(proxy) + '</code>' +
      '<button class="ghost sm" data-act="copy" data-copy="' + esc(proxy) + '">Copy URL</button></div>' +
    (token ? '<div class="faint small" style="padding:8px 18px 0">Send the token in the path, an <span class="mono">X-Rotator-Token</span> or <span class="mono">Authorization: Bearer</span> header, or <span class="mono">?token=</span>.</div>' : '') +
    editBlock + table + addKey +
    '</article>';
}

function keyRow(p, k){
  const editing = !!keyEdit[k.id];
  if (editing){
    const d = keyEdit[k.id];
    return '<tr data-kid="' + k.id + '">' +
      '<td colspan="7"><div class="inline" style="flex-wrap:wrap">' +
        '<input data-kf="label" value="' + esc(d.label) + '" placeholder="label" style="max-width:180px" aria-label="Key label">' +
        '<input data-kf="value" class="mono" value="' + esc(d.value) + '" placeholder="value" style="flex:1;min-width:220px" spellcheck="false" aria-label="Key value">' +
        '<button class="primary sm" data-act="save-key" data-pid="' + p.id + '" data-kid="' + k.id + '">Save</button>' +
        '<button class="ghost sm" data-act="cancel-key" data-kid="' + k.id + '">Cancel</button>' +
      '</div></td></tr>';
  }
  const shown = reveal[k.id] ? k.value : (k.value ? k.value.slice(0,4) + '…' + k.value.slice(-4) : '');
  return '<tr data-kid="' + k.id + '">' +
    '<td>' + esc(k.label || '—') + '</td>' +
    '<td><span class="kval mono">' + esc(shown) + '</span> ' +
      '<button class="ghost sm" data-act="reveal" data-kid="' + k.id + '">' + (reveal[k.id] ? 'hide' : 'show') + '</button></td>' +
    '<td><span data-k="status">' + statusBadge(k) + '</span></td>' +
    '<td class="num" data-k="ok">' + (k.success || 0) + '</td>' +
    '<td class="num" data-k="err">' + (k.errors || 0) + '</td>' +
    '<td class="muted" data-k="used">' + rel(k.lastUsed) + '</td>' +
    '<td class="right">' +
      '<button class="ghost" data-act="test-key" data-pid="' + p.id + '" data-kid="' + k.id + '">Test</button>' +
      '<button class="ghost" data-act="toggle-key" data-pid="' + p.id + '" data-kid="' + k.id + '">' + (k.enabled ? 'Disable' : 'Enable') + '</button>' +
      '<button class="ghost" data-act="edit-key" data-pid="' + p.id + '" data-kid="' + k.id + '">Edit</button>' +
      '<button class="ghost" data-act="reset-key" data-pid="' + p.id + '" data-kid="' + k.id + '" title="Clear cooldown and error state">Reset</button>' +
      '<button class="icon" data-act="del-key" data-pid="' + p.id + '" data-kid="' + k.id + '" title="Delete key" aria-label="Delete key">×</button>' +
    '</td></tr>';
}

// ---------- activity log ----------

function updateLogs(){
  const sig = LOGS.length + '|' + (LOGS[0] ? LOGS[0].time + '|' + LOGS[0].code + '|' + LOGS[0].path : '');
  if (sig === logSig) return;
  logSig = sig;
  const el = $('#logs');
  if (!LOGS.length){ el.innerHTML = '<div class="empty">No requests yet — send one through a proxy URL and it will appear here.</div>'; return; }
  const rows = LOGS.map(l => {
    const t = new Date(l.time * 1000).toLocaleTimeString();
    const key = l.key ? esc(l.key) : '<span class="faint">—</span>';
    return '<tr><td class="faint">' + t + '</td>' +
      '<td><span class="badge badge-code ' + (l.ok ? 'b-ok' : 'b-bad') + '">' + l.code + '</span></td>' +
      '<td class="mono">' + esc(l.method) + ' ' + esc(l.path) + '</td>' +
      '<td>' + esc(l.provider) + '</td>' +
      '<td class="mono">' + key + '</td>' +
      '<td class="num">' + l.ms + ' ms</td>' +
      '<td class="faint">' + esc(l.msg || '') + '</td></tr>';
  }).join('');
  el.innerHTML = '<table><thead><tr><th>Time</th><th>Status</th><th>Request</th><th>Provider</th><th>Key</th><th class="num">Latency</th><th>Note</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

// ---------- events ----------

document.addEventListener('change', (ev) => {
  const el = ev.target;
  const row = el.closest && el.closest('.rule');
  if (row && el.matches('[data-rf="preset"]')) applyPreset(row);
  const panel = el.closest && el.closest('.panel');
  if (panel) refreshGroups(panel);
});
document.addEventListener('input', (ev) => {
  const panel = ev.target.closest && ev.target.closest('.panel');
  if (panel) refreshGroups(panel);
});

document.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('[data-act]');
  if (!btn) return;
  const a = btn.dataset.act, pid = btn.dataset.pid || btn.dataset.id, kid = btn.dataset.kid;
  const findKey = (id) => {
    for (const p of S.providers) for (const k of p.keys || []) if (k.id === id) return k;
    return {};
  };
  try {
    switch (a){
      case 'open-new':
        newOpen = true; renderNew(); $('#newprovider').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'add-key-rule': {
        const panel = btn.closest('.panel');
        panel.querySelector('[data-keyrules]').insertAdjacentHTML('beforeend', keyRuleHTML());
        refreshGroups(panel);
        break;
      }
      case 'add-fixed-rule': {
        const panel = btn.closest('.panel');
        panel.querySelector('[data-fixedrules]').insertAdjacentHTML('beforeend', fixedRuleHTML());
        refreshGroups(panel);
        break;
      }
      case 'del-rule': {
        const row = btn.closest('.rule');
        const isKey = row.dataset.kind === 'key';
        const keyCount = row.closest('[data-keyrules]') ? row.closest('[data-keyrules]').querySelectorAll('.rule').length : 0;
        if (isKey && keyCount <= 1){ toast('Keep at least one place for the key', true); break; }
        const panel = row.closest('.panel');
        row.remove();
        refreshGroups(panel);
        break;
      }
      case 'copy':
        try { await navigator.clipboard.writeText(btn.dataset.copy); toast('Copied to clipboard', 'ok'); }
        catch(e){ toast('Copy failed — select it manually', true); }
        break;
      case 'reveal':
        reveal[kid] = !reveal[kid]; renderMain(); break;
      case 'toggle-provider': {
        const p = S.providers.find(x => x.id === pid);
        await api('/api/providers/' + pid, 'PUT', { enabled: !p.enabled });
        await load(); renderMain(); break;
      }
      case 'edit-provider':
        providerEdit[pid] = !providerEdit[pid]; renderMain(); break;
      case 'cancel-provider':
        delete providerEdit[pid]; renderMain(); break;
      case 'save-provider': {
        const card = btn.closest('.panel');
        const body = formBody(card);
        if (!body) return;
        if (!body.baseUrl){ toast('Base URL is required', true); return; }
        await api('/api/providers/' + pid, 'PUT', body);
        delete providerEdit[pid]; toast('Provider saved — applies immediately', 'ok'); await load(); renderMain(); break;
      }
      case 'del-provider':
        if (!confirm('Delete provider "' + btn.dataset.name + '" and all its keys?')) return;
        await api('/api/providers/' + pid, 'DELETE'); toast('Provider deleted', 'ok'); await load(); renderMain(); break;
      case 'test-provider': {
        btn.textContent = 'Testing…'; btn.disabled = true;
        const r = await api('/api/providers/' + pid + '/test', 'POST');
        const bad = (r.results || []).filter(x => !x.ok).length;
        toast(bad ? (bad + ' key(s) failed') : 'All keys OK', bad > 0 ? true : 'ok');
        await load(); renderMain(); break;
      }
      case 'add-key': {
        const val = (keyDraft[pid] || '').trim();
        if (!val){ toast('Paste a key first', true); return; }
        const alias = (keyAliasDraft[pid] || '').trim();
        await api('/api/providers/' + pid + '/keys', 'POST', { value: val, label: alias });
        keyDraft[pid] = ''; keyAliasDraft[pid] = '';
        toast(alias ? 'Key added as "' + alias + '"' : 'Key added', 'ok');
        await load(); renderMain(); break;
      }
      case 'del-key':
        await api('/api/providers/' + pid + '/keys/' + kid, 'DELETE'); await load(); renderMain(); break;
      case 'reset-key':
        await api('/api/providers/' + pid + '/keys/' + kid + '/reset', 'POST');
        toast('Key reset', 'ok'); await load(); renderMain(); break;
      case 'toggle-key': {
        const k = findKey(kid);
        await api('/api/providers/' + pid + '/keys/' + kid, 'PUT', { enabled: !k.enabled });
        await load(); renderMain(); break;
      }
      case 'test-key': {
        btn.textContent = '…'; btn.disabled = true;
        const r = await api('/api/providers/' + pid + '/keys/' + kid + '/test', 'POST');
        toast('Key ' + (r.ok ? 'OK' : 'failed') + ' (' + r.code + ')', r.ok ? 'ok' : true);
        await load(); renderMain(); break;
      }
      case 'edit-key': {
        const k = findKey(kid);
        keyEdit[kid] = { label: k.label || '', value: k.value || '' };
        renderMain();
        break;
      }
      case 'cancel-key':
        delete keyEdit[kid]; renderMain(); break;
      case 'save-key': {
        const tr = btn.closest('tr');
        const label = tr.querySelector('[data-kf="label"]').value.trim();
        const value = tr.querySelector('[data-kf="value"]').value.trim();
        const body = { label };
        if (value) body.value = value;
        await api('/api/providers/' + pid + '/keys/' + kid, 'PUT', body);
        delete keyEdit[kid]; toast('Key saved', 'ok'); await load(); renderMain(); break;
      }
    }
  } catch(e){ toast(e.message, true); }
});

$('#btn-new').onclick = () => { newOpen = !newOpen; renderNew(); if (newOpen) $('#newprovider').scrollIntoView({ behavior: 'smooth', block: 'start' }); };

showPage(location.hash.slice(1));
load();
setInterval(load, 3000);   // patches live values only; never re-renders forms
</script>
</body>
</html>
